name: Build and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev pkg-config mpv ffmpeg curl xvfb imagemagick libsecret-tools
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          scripts/check-ui.sh
      - name: Build Ubuntu package
        run: bash scripts/build-deb.sh ubuntu24.04
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-package
          path: dist/*.deb

  debian:
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y cargo rustc libgtk-3-dev pkg-config mpv ffmpeg curl dpkg-dev ca-certificates
      - name: Test and build Debian package
        run: |
          cargo test --locked
          bash scripts/build-deb.sh debian13
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb

  arch:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed cargo gtk3 mpv ffmpeg curl pkgconf git
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Test and build Arch package
        run: su builder -s /bin/bash -c "cd '$GITHUB_WORKSPACE' && cargo test --locked && bash scripts/build-arch.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*.pkg.tar.zst

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ubuntu, debian, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-package'
          merge-multiple: true
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
          fi
